<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Web Interface Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/a2d9d6d26b.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container-box">
    <h2 class="mb-3 text-center">✨ Prompt your Interface ✨</h2>
    <textarea id="prompt" class="form-control" placeholder="Describe the interface you want..."></textarea>
    <button class="btn btn-primary generate-btn" onclick="generateCode()">
      <i class="fas fa-magic magic-icon"></i>Generate
    </button>

    <div id="code-preview-container" class="mt-4" style="display: none; grid-template-columns: 1fr 1fr; gap: 1rem;">
      <div id="generated-code-section">
        <h5>Generated Code:</h5>
        <pre><code id="generatedCode" style="white-space: pre-wrap; max-height: 400px; overflow-y: auto; display: block;"></code></pre>
        <button class="btn btn-secondary btn-sm mt-2" onclick="copyCode()">
          <i class="fas fa-copy"></i> Copy Code
        </button>
      </div>
      <div id="live-preview-section">
        <h5>🔍 Live Preview</h5>
        <iframe id="previewFrame" style="width: 100%; height: 400px; border: 1px solid #ccc; border-radius: 0.5rem;"></iframe>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
